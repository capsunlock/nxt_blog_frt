<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings — Journal Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="admin-dashboard">

    <aside class="sidebar">
        <div class="sidebar-header">
                <a href="post_list.html" class="logo">JOURNAL</a>
                <button class="theme-toggle-btn sidebar-theme-toggle" id="theme-toggle" aria-label="Toggle theme">
                    <span class="sun-icon">☀️</span>
                    <span class="moon-icon">🌙</span>
                </button>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-group">
                <span class="nav-group-title">Content</span>
                    <a href="dashboard_home.html" class="sidebar-link"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                    <a href="dashboard.html" class="sidebar-link"><i data-lucide="layout-dashboard"></i> Overview</a>
                <a href="my_posts.html" class="sidebar-link"><i data-lucide="file-text"></i> My Posts</a>
                <a href="create_post.html" class="sidebar-link"><i data-lucide="plus-square"></i> New Post</a>
                <a href="media_library.html" class="sidebar-link"><i data-lucide="image"></i> Media</a>
            </div>
            <div class="nav-group">
                <span class="nav-group-title">Analytics</span>
                <a href="#" class="sidebar-link"><i data-lucide="bar-chart-3"></i> Traffic</a>
                <a href="#" class="sidebar-link"><i data-lucide="users"></i> Subscribers</a>
            </div>
            <div class="nav-group">
                <span class="nav-group-title">System</span>
                <a href="post_list.html" class="sidebar-link"><i data-lucide="external-link"></i> View Site</a>
                <a href="settings.html" class="sidebar-link active"><i data-lucide="settings"></i> Settings</a>
                <a href="login.html" class="sidebar-link"><i data-lucide="log-out"></i> Log Out</a>
            </div>
        </nav>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="main-stage">
        <button class="mobile-nav-toggle" id="menu-toggle">
            <i data-lucide="menu"></i>
        </button>

        <header class="admin-header">
            <h1>Global Config</h1>
            <div class="header-actions">
                <button id="search-btn" class="btn btn-icon" aria-label="Search"><i data-lucide="search"></i></button>
                <button class="btn btn-primary" id="save-settings">Save Changes</button>
            </div>
        </header>

        <section class="settings-grid">
            <div class="settings-card">
                <h2 class="section-title">Identity</h2>
                <div class="form-group">
                    <label>Journal Title</label>
                    <input type="text" id="site-title" placeholder="e.g. THE LOGIC INDEX">
                </div>
                <div class="form-group">
                    <label>Author Alias</label>
                    <input type="text" id="author-name" placeholder="Your Name">
                </div>
            </div>

            <div class="settings-card">
                <h2 class="section-title">Social Links</h2>
                <div class="form-group">
                    <label>X / Twitter</label>
                    <input type="url" id="social-x" placeholder="https://x.com/username">
                </div>
                <div class="form-group">
                    <label>GitHub</label>
                    <input type="url" id="social-github" placeholder="https://github.com/username">
                </div>
            </div>
        </section>
    </main>

    <div id="search-overlay" class="search-overlay">
        <button id="close-search" class="close-search">&times;</button>
        <div class="search-content">
            <input type="text" id="search-input" placeholder="Search...">
            <div id="search-suggestions" class="search-suggestions"></div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/settings.js"></script>
</body>
</html>
