<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories — Journal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/categories.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="progress-container"><div class="progress-bar"></div></div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="post_list.html" class="logo">JOURNAL</a>
            
            <div class="nav-links" id="navLinks">
                <a href="post_list.html">Feed</a>
                <a href="archive.html">Series</a>
                <a href="categories.html" style="opacity: 1; color: var(--accent-color);">Categories</a>
                <a href="about.html">About</a>
            </div>

            <div class="nav-controls">
                <button id="mobile-menu" class="menu-toggle" aria-label="Menu">
                    <span></span>
                    <span></span>
                </button>
                <button id="search-btn"><i data-lucide="search"></i></button>
                <button id="theme-toggle">
                    <span class="sun-icon">☀️</span>
                    <span class="moon-icon">🌙</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="content">
        <header class="page-header">
            <h1>Browse by Topic</h1>
            <p>Select a category to filter the journal entries.</p>
        </header>

        <section class="category-grid" id="category-container">
            <div class="loading">Analyzing local records...</div>
        </section>
    </main>

    <div id="search-overlay" class="search-overlay">
        <button id="close-search" class="close-search">&times;</button>
        <div class="search-content">
            <input type="text" id="search-input" placeholder="Search...">
            <div id="search-suggestions" class="search-suggestions"></div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/categories.js"></script>
</body>
</html>
