<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Blog</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo">JOURNAL</a>

            <div class="nav-links" id="navLinks">
                    <a href="/">Articles</a>
                    <a href="#">Series</a>
                    <a href="#">Talk to us</a>
            </div>
            
            <div class="nav-controls">
                <button id="search-btn" aria-label="Search">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>

                <button id="theme-toggle" aria-label="Change Mode">
                    <span class="sun-icon">☀️</span>
                    <span class="moon-icon">🌙</span>
                </button>

                <button class="menu-toggle" id="mobile-menu">
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </nav>

    <main class="content">
    </main>

    <footer>
            <p>&copy; 2026 Blog Project</p>
    </footer>

    <div id="search-overlay" class="search-overlay">
        <button id="close-search" class="close-search" aria-label="Close Search">&times;</button>
        <div class="search-content">
        <input type="text" id="search-input" placeholder="Type to search..." autocomplete="off">
        <div class="search-results" id="search-results">
            </div>
        </div>
    </div>
    
    <script src="js/script.js"></script>
</body>
</html>
