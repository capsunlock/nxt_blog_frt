<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Access — Journal</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-card {
            max-width: 400px;
            margin: 10vh auto;
            padding: 3rem;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background: var(--bg-color);
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
        }
        input {
            width: 100%;
            padding: 1rem;
            margin: 1.5rem 0;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
        }
        .btn-primary {
            width: 100%;
            padding: 1rem;
            background: var(--text-color);
            color: var(--bg-color);
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body style="background: #fcfcfc;">
    <div class="auth-card">
        <h2 style="margin-bottom: 0.5rem;">Reset Access</h2>
        <p style="font-size: 0.9rem; color: var(--secondary-text);">Enter your recovery email to receive a secure link.</p>
        
        <form id="reset-request-form">
            <input type="email" placeholder="admin@domain.com" required>
            <button type="submit" class="btn-primary">Send Reset Link</button>
        </form>
        
        <a href="login.html" style="display: block; text-align: center; margin-top: 2rem; font-size: 0.8rem; color: var(--secondary-text); text-decoration: none;">Return to Login</a>
    </div>
</body>
</html>
