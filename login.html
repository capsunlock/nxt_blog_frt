<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entry — Journal Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <a href="post_list.html" class="login-logo">JOURNAL / AUTH</a>
            
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="id">Author Identity</label>
                    <input type="email" id="id" placeholder="email@journal.com" required>
                </div>
                <div class="form-group">
                    <label for="pass">Passkey</label>
                    <input type="password" id="pass" placeholder="••••••••" required>
                </div>
                
                <div class="login-actions">
                    <button type="submit" class="enter-btn">Authenticate</button>
                    <div class="auth-meta">
                        <a href="password_reset.html">Lost Access?</a>
                        <a href="post_list.html">Back to Public Index</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/login.js""></script>
</body>
</html>
