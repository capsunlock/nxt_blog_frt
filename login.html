<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entry — Journal Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .login-wrapper {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            text-align: center;
        }
        .login-logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 4px;
            text-decoration: none;
            color: var(--text-color);
            display: block;
            margin-bottom: 3rem;
        }
        .login-form {
            text-align: left;
            display: grid;
            gap: 2rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .form-group label {
            text-transform: uppercase;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            opacity: 0.5;
        }
        .form-group input {
            background: none;
            border: none;
            border-bottom: 2px solid var(--border-color);
            padding: 0.8rem 0;
            color: var(--text-color);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: var(--text-color);
        }
        .login-actions {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .enter-btn {
            background: var(--text-color);
            color: var(--bg-color);
            border: none;
            padding: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .enter-btn:hover {
            opacity: 0.9;
        }
        .auth-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
        }
        .auth-meta a {
            color: var(--secondary-text);
            text-decoration: none;
            font-weight: 600;
        }
        .auth-meta a:hover {
            color: var(--text-color);
        }
        
        /* Transition for the "locked" feel */
        body.logging-in {
            filter: blur(10px);
            pointer-events: none;
            transition: filter 0.6s ease;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <a href="post_list.html" class="login-logo">JOURNAL / AUTH</a>
            
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="id">Author Identity</label>
                    <input type="email" id="id" placeholder="email@journal.com" required>
                </div>
                <div class="form-group">
                    <label for="pass">Passkey</label>
                    <input type="password" id="pass" placeholder="••••••••" required>
                </div>
                
                <div class="login-actions">
                    <button type="submit" class="enter-btn">Authenticate</button>
                    <div class="auth-meta">
                        <a href="password_reset.html">Lost Access?</a>
                        <a href="post_list.html">Back to Public Index</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('.enter-btn');
            btn.innerText = "Verifying...";
            
            // Simulation of dashboard entry
            setTimeout(() => {
                document.body.classList.add('logging-in');
                setTimeout(() => {
                    window.location.href = 'dashboard_home.html';
                }, 600);
            }, 1000);
        });
    </script>
</body>
</html>
