<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entry — Journal Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="post_list.html" class="logo">JOURNAL</a>
            <div class="nav-links" id="navLinks">
                <a href="post_list.html">Feed</a>
                <a href="archive.html">Series</a>
                <a href="categories.html">Categories</a>
                <a href="about.html">Manifesto</a>
            </div>
            <div class="nav-controls">
                <button id="mobile-menu" class="menu-toggle" aria-label="Menu">
                    <span></span>
                    <span></span>
                </button>
                <button id="search-btn"><i data-lucide="search"></i></button>
                <button id="theme-toggle">☀️</button>
            </div>
        </div>
    </nav>

    <div class="login-wrapper">
        <div class="login-card">
            <a href="post_list.html" class="login-logo">JOURNAL / AUTH</a>
            
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="id">Author Identity</label>
                    <input type="email" id="id" placeholder="email@journal.com" required>
                </div>
                <div class="form-group">
                    <label for="pass">Passkey</label>
                    <input type="password" id="pass" placeholder="••••••••" required>
                </div>
                
                <div class="login-actions">
                    <button type="submit" class="enter-btn">Authenticate</button>
                    <div class="auth-meta">
                        <a href="password_reset.html">Lost Access?</a>
                        <a href="post_list.html">Back to Public Index</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div id="search-overlay" class="search-overlay">
        <button id="close-search" class="close-search">&times;</button>
        <div class="search-content">
            <input type="text" id="search-input" placeholder="Search...">
            <div id="search-suggestions" class="search-suggestions"></div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
