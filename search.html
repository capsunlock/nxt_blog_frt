<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results — Journal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/search.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="progress-container">
        <div class="progress-bar" id="myBar"></div>
    </div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="post_list.html" class="logo">JOURNAL</a>
            <div class="nav-links" id="navLinks">
                <a href="post_list.html">Feed</a>
                <a href="archive.html">Series</a>
                <a href="categories.html">Categories</a>
                <a href="about.html">Manifesto</a>
            </div>
            <div class="nav-controls">
                <button id="mobile-menu" class="menu-toggle" aria-label="Menu">
                    <span></span>
                    <span></span>
                </button>
                <button id="search-btn"><i data-lucide="search"></i></button>
                <button id="theme-toggle">☀️</button>
            </div>
        </div>
    </nav>

    <main class="content-wrapper">
        <div class="search-container">
            <header class="search-header">
                <h1>Search Results</h1>
                <div class="search-bar">
                    <input 
                        type="text" 
                        id="search-input" 
                        class="search-input" 
                        placeholder="Search posts, authors, tags..."
                        value=""
                    >
                    <button id="search-submit-btn" class="search-submit">
                        <i data-lucide="search"></i>
                    </button>
                </div>
                <p class="search-query" id="searchQuery"></p>
            </header>

            <section class="search-results">
                <div class="results-container" id="searchResults">
                    <div class="loading-state">Searching...</div>
                </div>
            </section>

            <section class="search-filters">
                <div class="filter-group">
                    <h3>Filters</h3>
                    <label class="filter-item">
                        <input type="checkbox" value="posts" class="filter-checkbox">
                        <span>Posts</span>
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" value="authors" class="filter-checkbox">
                        <span>Authors</span>
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" value="tags" class="filter-checkbox">
                        <span>Tags</span>
                    </label>
                </div>
            </section>
        </div>
    </main>

    <div id="search-overlay" class="search-overlay">
        <button id="close-search" class="close-search">&times;</button>
        <div class="search-content">
            <input type="text" id="search-input" placeholder="Search...">
            <div id="search-suggestions" class="search-suggestions"></div>
        </div>
    </div>

    <footer class="site-footer">
        <div id="footer-credits">© 2026 — Journal</div>
    </footer>

    <script src="js/script.js"></script>
    <script src="js/search.js"></script>
</body>
</html>
