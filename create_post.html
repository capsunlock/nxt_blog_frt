<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Post — Journal</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; }

        :root {
            --sidebar-width: 260px;
            --admin-bg: #f9f9f9;
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --border-color: #e0e0e0;
            --danger-color: #e63946;
        }

        [data-theme="dark"] { 
            --admin-bg: #0a0a0a; 
            --bg-color: #111111;
            --text-color: #eeeeee;
            --border-color: #333333;
        }

        body {
            display: flex;
            min-height: 100vh;
            background-color: var(--admin-bg);
            color: var(--text-color);
            margin: 0;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background 0.3s ease;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-color);
            border-right: 1px solid var(--border-color);
            position: fixed;
            height: 100vh;
            z-index: 2000;
        }

        .nav-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-item {
            margin-bottom: 1.5rem;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 800;
        }

        .nav-link.secondary {
            opacity: 0.5;
        }

        /* --- Layout --- */
        .main-stage { 
            margin-left: var(--sidebar-width); 
            flex-grow: 1; 
            padding: 2rem 5% 12rem; 
            width: calc(100% - var(--sidebar-width));
        }

        .editor-container { max-width: 1100px; margin: 0 auto; width: 100%; }

        /* --- Header & Hero --- */
        .editor-header { position: relative; }
        
        .btn-clear {
            position: absolute; top: 0; right: 0;
            background: transparent; border: 1px solid var(--border-color);
            color: var(--text-color); padding: 6px 12px; font-size: 0.6rem;
            font-weight: 800; text-transform: uppercase; cursor: pointer;
            opacity: 0.3; transition: 0.2s; display: flex; align-items: center; gap: 4px;
        }
        .btn-clear:hover { opacity: 1; color: var(--danger-color); border-color: var(--danger-color); }

        .post-title-input, .post-subtitle-input {
            width: 100%; background: transparent; border: none;
            color: var(--text-color); outline: none; resize: none; line-height: 1.2;
        }
        .post-title-input { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 900; margin-bottom: 0.5rem; padding-right: 80px; }
        .post-subtitle-input { font-size: 1.5rem; opacity: 0.6; margin-bottom: 2rem; }

        .hero-upload-zone {
            width: 100%; height: 250px; background: var(--bg-color);
            border: 2px dashed var(--border-color); margin-bottom: 2rem;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; position: relative; overflow: hidden;
        }
        .hero-upload-zone img { width: 100%; height: 100%; object-fit: cover; }
        .hero-placeholder { text-align: center; opacity: 0.4; text-transform: uppercase; font-size: 0.7rem; font-weight: 800; }

        /* --- Meta Fields --- */
        .post-meta-fields { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.5rem; border-bottom: 1px solid var(--border-color);
            padding-bottom: 2rem; margin-bottom: 2rem; 
        }
        .meta-field { display: flex; flex-direction: column; gap: 4px; }
        .meta-label { font-size: 0.6rem; text-transform: uppercase; font-weight: 800; opacity: 0.5; cursor: pointer; }
        .meta-input { background: none; border: none; font-size: 0.85rem; font-weight: 700; color: var(--text-color); outline: none; }

        /* --- Editor Split --- */
        .editor-split { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; }
        .editor-body { 
            width: 100%; min-height: 500px; background: transparent; border: none;
            font-size: 1.1rem; line-height: 1.7; color: var(--text-color);
            outline: none; resize: none; font-family: 'Courier New', monospace;
        }
        .preview-pane { border-left: 1px solid var(--border-color); padding-left: 2rem; }
        .preview-pane figure { margin: 2rem 0; text-align: center; }
        .preview-pane figure img { max-width: 100%; height: auto; border: 1px solid var(--border-color); }
        .preview-pane figcaption { margin-top: 0.8rem; font-size: 0.9rem; opacity: 0.6; font-style: italic; }

        /* --- Toolbar --- */
        .editor-toolbar {
            position: fixed; bottom: 1.5rem; left: calc(var(--sidebar-width) + 1.5rem);
            right: 1.5rem; background: var(--bg-color); border: 2px solid var(--border-color);
            padding: 0.8rem 1.2rem; display: flex; justify-content: space-between;
            align-items: center; z-index: 3000; box-shadow: 6px 6px 0px var(--border-color);
        }

        .toolbar-section { display: flex; align-items: center; gap: 12px; }

        .btn {
            background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color);
            padding: 0.6rem 1rem; font-size: 0.7rem; font-weight: 800; text-transform: uppercase;
            cursor: pointer; display: flex; align-items: center; gap: 6px;
        }
        .btn-primary { background: var(--text-color); color: var(--bg-color); }
        .btn-icon { padding: 0.6rem; }

        /* --- Toast System --- */
        #toast-container { position: fixed; bottom: 7rem; right: 2rem; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { 
            background: var(--text-color); color: var(--bg-color); padding: 1rem 1.5rem;
            font-size: 0.7rem; font-weight: 800; text-transform: uppercase;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 12px;
            transform: translateX(120%); opacity: 0; transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .toast.show { transform: translateX(0); opacity: 1; }

        @media (max-width: 1024px) {
            .sidebar { display: none; }
            .main-stage { margin-left: 0; width: 100%; }
            .editor-toolbar { left: 1rem; right: 1rem; }
            .editor-split { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div style="padding: 2rem; border-bottom: 1px solid var(--border-color);">
            <span style="font-weight: 900; letter-spacing: -1px;">JOURNAL</span>
        </div>
        <nav style="padding: 2rem;">
            <ul class="nav-list">
                <li class="nav-item">
                    <a href="#" class="nav-link"><i data-lucide="plus-square"></i> New Post</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link secondary"><i data-lucide="file-text"></i> My Posts</a>
                </li>
            </ul>
        </nav>
    </aside>

    <main class="main-stage">
        <div class="editor-container">
            <header class="editor-header">
                <button class="btn-clear" id="btn-reset"><i data-lucide="trash-2" style="width:12px"></i> Clear Draft</button>
                <textarea id="post-title" class="post-title-input auto-expand" placeholder="Post Title" rows="1"></textarea>
                <textarea id="post-subtitle" class="post-subtitle-input auto-expand" placeholder="Subtitle..." rows="1"></textarea>
            </header>

            <div class="hero-upload-zone" id="hero-drop-zone">
                <div class="hero-placeholder" id="hero-placeholder">
                    <i data-lucide="image" style="width:32px; height:32px; margin-bottom:10px"></i>
                    <div>Set Hero Image</div>
                </div>
                <img id="hero-preview" src="" style="display:none;" alt="Hero Preview">
                <input type="file" id="hero-input" hidden accept="image/*">
            </div>

            <section class="post-meta-fields">
                <div class="meta-field">
                    <label for="post-category" class="meta-label">Category</label>
                    <input type="text" id="post-category" class="meta-input" placeholder="Architecture">
                </div>
                <div class="meta-field">
                    <label for="post-tags" class="meta-label">Tags</label>
                    <input type="text" id="post-tags" class="meta-input" placeholder="Design, Tech">
                </div>
                <div class="meta-field">
                    <label for="post-slug" class="meta-label">Slug</label>
                    <input type="text" id="post-slug" class="meta-input" placeholder="post-url-handle">
                </div>
            </section>

            <div class="editor-split" id="editor-split">
                <div id="pane-write">
                    <textarea class="editor-body" id="markdown-input" placeholder="Tell your story..."></textarea>
                </div>
                <div id="pane-preview" class="preview-pane">
                    <div id="preview-content"></div>
                </div>
            </div>
        </div>

        <div class="editor-toolbar">
            <div class="toolbar-section">
                <button class="btn btn-icon" id="theme-switcher"><i data-lucide="moon" id="theme-icon" style="width:16px"></i></button>
                <button class="btn btn-icon" id="btn-media" title="Insert Figure"><i data-lucide="plus-circle" style="width:16px"></i></button>
            </div>

            <div class="toolbar-section">
                <div style="font-size: 0.6rem; font-weight: 800; opacity: 0.4; text-align: right; line-height: 1;">
                    <div id="read-time">1 MIN READ</div>
                    <div style="margin-top: 4px;">WORDS: <span id="word-count">0</span></div>
                </div>
                <button class="btn" id="btn-draft"><i data-lucide="save" style="width:14px"></i> <span class="btn-text">Draft</span></button>
                <button class="btn btn-primary" id="btn-publish"><i data-lucide="send" style="width:14px"></i> <span class="btn-text">Publish</span></button>
            </div>
        </div>

        <div id="media-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:5000; align-items:center; justify-content:center; backdrop-filter:blur(5px);">
            <div style="background:var(--bg-color); border:2px solid var(--border-color); padding:2rem; width:90%; max-width:400px; box-shadow:10px 10px 0px var(--border-color);">
                
                <div id="drop-zone" style="border:2px dashed var(--border-color); padding:2rem; text-align:center; cursor:pointer; margin-bottom: 1rem;">
                    <p style="font-size:0.7rem; font-weight:800; text-transform:uppercase;">1. Choose Body Image</p>
                    <input type="file" id="file-input" hidden accept="image/*">
                    <img id="modal-preview" style="display:none; width:100%; height:120px; object-fit:cover; margin-top:10px; border:1px solid var(--border-color);">
                </div>

                <div class="meta-field" style="margin-bottom: 1.5rem;">
                    <label for="alt-text-input" class="meta-label">2. Description for Robots (Alt Text)</label>
                    <input type="text" id="alt-text-input" class="meta-input" placeholder="e.g., A brutalist concrete building" style="border-bottom: 1px solid var(--border-color); width: 100%; padding: 5px 0;">
                </div>

                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-primary" id="insert-media-btn" style="flex: 2; justify-content:center;">Insert into Post</button>
                    <button class="btn" style="flex: 1; justify-content:center;" onclick="closeMediaModal()">Cancel</button>
                </div>
            </div>
        </div>

        <div id="toast-container"></div>
    </main>

    <script>
        lucide.createIcons();

        const input = document.getElementById('markdown-input');
        const output = document.getElementById('preview-content');
        const titleInput = document.getElementById('post-title');
        const subtitleInput = document.getElementById('post-subtitle');
        const wordCount = document.getElementById('word-count');
        const readTime = document.getElementById('read-time');
        
        let selectedFileBlob = null;

        function saveToLocal() {
            const postData = {
                title: titleInput.value,
                subtitle: subtitleInput.value,
                body: input.value,
                category: document.getElementById('post-category').value,
                tags: document.getElementById('post-tags').value,
                slug: document.getElementById('post-slug').value
            };
            localStorage.setItem('journal_draft', JSON.stringify(postData));
        }

        function loadFromLocal() {
            const saved = localStorage.getItem('journal_draft');
            if (saved) {
                const data = JSON.parse(saved);
                titleInput.value = data.title || "";
                subtitleInput.value = data.subtitle || "";
                input.value = data.body || "";
                document.getElementById('post-category').value = data.category || "";
                document.getElementById('post-tags').value = data.tags || "";
                document.getElementById('post-slug').value = data.slug || "";
                updateEditor();
            }
        }

        function updateEditor() {
            output.innerHTML = marked.parse(input.value);
            
            // Statistics logic
            const words = input.value.trim() ? input.value.trim().split(/\s+/).length : 0;
            const minutes = Math.max(1, Math.ceil(words / 200));
            
            wordCount.innerText = words;
            readTime.innerText = `${minutes} MIN READ`;

            [titleInput, subtitleInput, input].forEach(el => {
                el.style.height = 'auto';
                el.style.height = el.scrollHeight + 'px';
            });
        }

        [titleInput, subtitleInput, input, document.getElementById('post-category'), document.getElementById('post-tags'), document.getElementById('post-slug')].forEach(el => {
            el.addEventListener('input', () => {
                updateEditor();
                saveToLocal();
            });
        });

        // Theme Toggle
        document.getElementById('theme-switcher').onclick = () => {
            const html = document.documentElement;
            const isLight = html.getAttribute('data-theme') === 'light';
            html.setAttribute('data-theme', isLight ? 'dark' : 'light');
            document.getElementById('theme-icon').setAttribute('data-lucide', isLight ? 'sun' : 'moon');
            lucide.createIcons();
            showToast(`Theme: ${isLight ? 'Dark' : 'Light'}`, isLight ? 'moon' : 'sun');
        };

        // Hero Image Logic
        const heroInput = document.getElementById('hero-input');
        document.getElementById('hero-drop-zone').onclick = () => heroInput.click();
        heroInput.onchange = (e) => {
            const file = e.target.files[0];
            if(file) {
                document.getElementById('hero-preview').src = URL.createObjectURL(file);
                document.getElementById('hero-preview').style.display = 'block';
                document.getElementById('hero-placeholder').style.display = 'none';
                showToast("Hero image updated");
            }
        };

        // Media Modal Logic
        const mediaModal = document.getElementById('media-modal');
        const fileInput = document.getElementById('file-input');
        const altInput = document.getElementById('alt-text-input');
        const modalPreview = document.getElementById('modal-preview');

        document.getElementById('btn-media').onclick = () => {
            mediaModal.style.display = 'flex';
            altInput.value = "";
            modalPreview.style.display = 'none';
        };

        document.getElementById('drop-zone').onclick = () => fileInput.click();

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if(file) {
                selectedFileBlob = URL.createObjectURL(file);
                modalPreview.src = selectedFileBlob;
                modalPreview.style.display = 'block';
                altInput.value = file.name.split('.')[0]; 
            }
        };

        document.getElementById('insert-media-btn').onclick = () => {
            if(!selectedFileBlob) {
                showToast("Choose an image first", "image");
                return;
            }

            const altText = altInput.value || "Journal Image";
            const imgStr = `\n<figure class="inline-image">\n  <img src="${selectedFileBlob}" alt="${altText}">\n  <figcaption>${altText}</figcaption>\n</figure>\n`;
            
            const start = input.selectionStart;
            input.value = input.value.substring(0, start) + imgStr + input.value.substring(input.selectionEnd);
            
            closeMediaModal();
            updateEditor();
            saveToLocal();
            showToast("Figure inserted");
        };

        function closeMediaModal() {
            mediaModal.style.display = 'none';
            selectedFileBlob = null;
        }

        // Action Buttons
        document.getElementById('btn-reset').onclick = () => {
            if (confirm("Delete current draft forever?")) {
                localStorage.removeItem('journal_draft');
                location.reload(); 
            }
        };

        document.getElementById('btn-draft').onclick = () => {
            saveToLocal();
            showToast("Draft Saved Locally");
        };

        document.getElementById('btn-publish').onclick = () => {
            showToast("Post Published!", "send");
        };

        function showToast(msg, icon = "check") {
            const container = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = 'toast';
            t.innerHTML = `<i data-lucide="${icon}" style="width:16px"></i><span>${msg}</span>`;
            container.appendChild(t);
            lucide.createIcons();
            requestAnimationFrame(() => t.classList.add('show'));
            setTimeout(() => {
                t.classList.remove('show');
                setTimeout(() => t.remove(), 500);
            }, 3000);
        }

        window.onload = loadFromLocal;
    </script>
    <script src="js/script.js"></script>
</body>
</html>
