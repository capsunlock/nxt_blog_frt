<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Comments — Journal Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/comments_management.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
    <body class="admin-dashboard">

    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="post_list.html" class="logo">JOURNAL</a>
            <div class="sidebar-header-actions">
                <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle theme">
                    <i data-lucide="sun" class="sun-icon"></i>
                    <i data-lucide="moon" class="moon-icon"></i>
                </button>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-group">
                <span class="nav-group-title">Content</span>
                <a href="dashboard_home.html" class="sidebar-link"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="dashboard.html" class="sidebar-link"><i data-lucide="layout-dashboard"></i> Overview</a>
                <a href="my_posts.html" class="sidebar-link"><i data-lucide="file-text"></i> My Posts</a>
                <a href="create_post.html" class="sidebar-link"><i data-lucide="plus-square"></i> New Post</a>
                <a href="media_library.html" class="sidebar-link"><i data-lucide="image"></i> Media</a>
            </div>
            <div class="nav-group">
                <span class="nav-group-title">Analytics</span>
                <a href="#" class="sidebar-link"><i data-lucide="bar-chart-3"></i> Traffic</a>
                <a href="#" class="sidebar-link"><i data-lucide="users"></i> Subscribers</a>
            </div>
            <div class="nav-group">
                <span class="nav-group-title">System</span>
                <a href="post_list.html" class="sidebar-link"><i data-lucide="external-link"></i> View Site</a>
                <a href="settings.html" class="sidebar-link"><i data-lucide="settings"></i> Settings</a>
                <a href="login.html" class="sidebar-link"><i data-lucide="log-out"></i> Log Out</a>
            </div>
        </nav>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="main-stage">
        <button class="mobile-nav-toggle" id="menu-toggle" aria-label="Menu">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </button>

        <header class="comments-header">
            <h1>Comments Management</h1>
            <div class="filter-controls">
                <button id="search-btn" class="btn btn-icon" aria-label="Search"><i data-lucide="search"></i></button>
                <select id="statusFilter" class="filter-select">
                    <option value="">All Comments</option>
                    <option value="pending">Pending Review</option>
                    <option value="approved">Approved</option>
                    <option value="spam">Spam</option>
                </select>
                <input type="text" id="searchFilter" class="search-input" placeholder="Search comments...">
            </div>
        </header>

        <section class="comments-list" id="commentsList">
            <div class="empty-state">
                <i data-lucide="message-square"></i>
                <p>No comments yet.</p>
            </div>
        </section>

        <!-- Comment Detail Modal -->
        <div class="modal" id="commentModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Comment Details</h2>
                    <button class="close-btn" onclick="closeCommentModal()">×</button>
                </div>

                <div class="comment-detail" id="commentDetail">
                    <!-- Populated by JS -->
                </div>

                <div class="modal-actions">
                    <button class="btn btn-primary" onclick="approveComment()">
                        <i data-lucide="check"></i> Approve
                    </button>
                    <button class="btn btn-secondary" onclick="rejectComment()">
                        <i data-lucide="x"></i> Reject
                    </button>
                    <button class="btn btn-danger" onclick="markSpam()">
                        <i data-lucide="alert-triangle"></i> Mark as Spam
                    </button>
                </div>
            </div>
        </div>
    </main>

    <div id="search-overlay" class="search-overlay">
        <button id="close-search" class="close-search">&times;</button>
        <div class="search-content">
            <input type="text" id="search-input" placeholder="Search...">
            <div id="search-suggestions" class="search-suggestions"></div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/comments_management.js"></script>
</body>
</html>
