<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal — Editorial</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .redirect-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 2rem;
        }
        .redirect-container h1 {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: -2px;
        }
        .redirect-container p {
            opacity: 0.6;
            font-size: 1.1rem;
        }
        .redirect-container a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 700;
            border-bottom: 2px solid var(--accent-color);
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <h1>JOURNAL</h1>
        <p>The post list is now the new home page.</p>
        <a href="post_list.html">Continue to Home →</a>
    </div>
    <script>
        setTimeout(() => {
            window.location.href = 'post_list.html';
        }, 1500);
    </script>
    <div id="search-overlay" class="search-overlay">
        <button id="close-search" class="close-search">&times;</button>
        <div class="search-content">
            <input type="text" id="search-input" placeholder="Search...">
            <div id="search-suggestions" class="search-suggestions"></div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
