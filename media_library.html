<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Library — Journal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/media_library.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
    <body class="admin-dashboard">

    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="post_list.html" class="logo">JOURNAL</a>
            <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle theme">
                <i data-lucide="sun" class="sun-icon"></i>
                <i data-lucide="moon" class="moon-icon"></i>
            </button>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-group">
                <span class="nav-group-title">Content</span>
                <a href="dashboard_home.html" class="sidebar-link"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="dashboard.html" class="sidebar-link"><i data-lucide="layout-dashboard"></i> Overview</a>
                <a href="my_posts.html" class="sidebar-link"><i data-lucide="file-text"></i> My Posts</a>
                <a href="create_post.html" class="sidebar-link"><i data-lucide="plus-square"></i> New Post</a>
                <a href="media_library.html" class="sidebar-link active"><i data-lucide="image"></i> Media</a>
            </div>
            <div class="nav-group">
                <span class="nav-group-title">Analytics</span>
                <a href="#" class="sidebar-link"><i data-lucide="bar-chart-3"></i> Traffic</a>
                <a href="#" class="sidebar-link"><i data-lucide="users"></i> Subscribers</a>
            </div>
            <div class="nav-group">
                <span class="nav-group-title">System</span>
                <a href="post_list.html" class="sidebar-link"><i data-lucide="external-link"></i> View Site</a>
                <a href="settings.html" class="sidebar-link"><i data-lucide="settings"></i> Settings</a>
                <a href="login.html" class="sidebar-link"><i data-lucide="log-out"></i> Log Out</a>
            </div>
        </nav>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="main-stage">
        <button class="mobile-nav-toggle" id="menu-toggle" aria-label="Menu">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </button>

        <div class="page-header">
            <div>
                <span class="nav-group-title" style="margin:0">Assets</span>
                <h1>Media Library</h1>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <button id="search-btn" class="btn btn-icon" aria-label="Search"><i data-lucide="search"></i></button>
                <button class="upload-btn"><i data-lucide="upload-cloud"></i> Upload New</button>
            </div>
        </div>

        <div class="media-controls">
            <span class="nav-group-title" style="margin:0" id="file-count">Showing 2 of 84 files</span>
            <div style="display: flex; gap: 1rem;">
                <select class="form-select">
                    <option>All Media</option>
                    <option>Images</option>
                    <option>Documents</option>
                </select>
            </div>
        </div>

        <div class="media-grid">
            <div class="media-card">
                <div class="media-actions">
                    <button class="icon-btn action-copy" title="Copy Link" data-url="https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85">
                        <i data-lucide="link-2" style="width:16px; height:16px;"></i>
                    </button>
                    <button class="icon-btn action-delete" title="Delete">
                        <i data-lucide="trash-2" style="width:16px; height:16px;"></i>
                    </button>
                </div>
                <img src="https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&w=400" class="media-thumb" alt="Architecture">
                <div class="media-info">
                    <span class="media-name">minimalist-lamp.jpg</span>
                    <span class="media-meta">JPG • 420 KB</span>
                </div>
            </div>

            <div class="media-card">
                <div class="media-actions">
                    <button class="icon-btn action-copy" title="Copy Link" data-url="https://images.unsplash.com/photo-1512446813987-060361ca11bc">
                        <i data-lucide="link-2" style="width:16px; height:16px;"></i>
                    </button>
                    <button class="icon-btn action-delete" title="Delete">
                        <i data-lucide="trash-2" style="width:16px; height:16px;"></i>
                    </button>
                </div>
                <img src="https://images.unsplash.com/photo-1512446813987-060361ca11bc?auto=format&fit=crop&w=400" class="media-thumb" alt="Interior">
                <div class="media-info">
                    <span class="media-name">brutalist-concrete.png</span>
                    <span class="media-meta">PNG • 1.2 MB</span>
                </div>
            </div>
        </div>

        <div id="toast-container" class="toast-container"></div>
    </main>

    <div id="search-overlay" class="search-overlay">
        <button id="close-search" class="close-search">&times;</button>
        <div class="search-content">
            <input type="text" id="search-input" placeholder="Search...">
            <div id="search-suggestions" class="search-suggestions"></div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/media_library.js"></script>
</body>
</html>
