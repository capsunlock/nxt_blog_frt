<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Library — Journal</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --sidebar-width: 260px;
            --admin-bg: #f9f9f9;
        }

        [data-theme="dark"] { --admin-bg: #0a0a0a; }

        body {
            display: flex;
            min-height: 100vh;
            background-color: var(--admin-bg);
            margin: 0;
            overflow-x: hidden;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
            transition: transform 0.4s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .sidebar-header { padding: 2rem; border-bottom: 1px solid var(--border-color); }
        .sidebar-header .logo { text-decoration: none; font-weight: 900; color: var(--text-color); font-size: 1.2rem; }
        .sidebar-nav { padding: 2rem; flex-grow: 1; overflow-y: auto; }
        .nav-group { margin-bottom: 2.5rem; }
        .nav-group-title { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.15em; font-weight: 800; opacity: 0.4; margin-bottom: 1rem; display: block; }
        .sidebar-link { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text-color); font-size: 0.9rem; font-weight: 600; padding: 0.8rem 0; opacity: 0.7; transition: opacity 0.2s; }
        .sidebar-link:hover, .sidebar-link.active { opacity: 1; }
        .sidebar-link i { width: 18px; height: 18px; }

        /* --- Mobile Elements --- */
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.3); backdrop-filter: blur(2px); z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.4s; }
        .mobile-nav-toggle { display: none; position: fixed; top: 1.5rem; right: 1.5rem; z-index: 1000; background: var(--text-color); color: var(--bg-color); border: none; padding: 10px; cursor: pointer; }

        @media (max-width: 1024px) {
            .mobile-nav-toggle { display: block; }
            .sidebar { transform: translateX(-100%); }
            .sidebar.active { transform: translateX(0); }
            .sidebar.active ~ .sidebar-overlay { opacity: 1; pointer-events: auto; }
            .main-stage { margin-left: 0 !important; padding-top: 6rem !important; }
        }

        /* --- Main Content --- */
        .main-stage { margin-left: var(--sidebar-width); flex-grow: 1; padding: 4rem 5%; }
        
        .page-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 3rem; }
        .page-header h1 { font-size: 2.5rem; font-weight: 800; margin: 0; }

        /* --- Media Grid --- */
        .media-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; }
        .upload-btn { background: var(--text-color); color: var(--bg-color); border: none; padding: 0.8rem 1.5rem; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; gap: 8px; }

        .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.5rem; }
        
        .media-card { background: var(--bg-color); border: 1px solid var(--border-color); position: relative; overflow: hidden; }
        .media-thumb { width: 100%; aspect-ratio: 1/1; object-fit: cover; filter: grayscale(1); transition: filter 0.3s; display: block; }
        .media-card:hover .media-thumb { filter: grayscale(0); }
        
        .media-info { padding: 1rem; border-top: 1px solid var(--border-color); background: var(--bg-color); }
        .media-name { font-size: 0.75rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
        .media-meta { font-size: 0.65rem; opacity: 0.5; text-transform: uppercase; margin-top: 0.3rem; display: block; }

        .media-actions { position: absolute; top: 0.5rem; right: 0.5rem; display: flex; gap: 0.5rem; opacity: 0; transition: opacity 0.2s; z-index: 10; }
        .media-card:hover .media-actions { opacity: 1; }

        /* --- Refined Icon Buttons --- */
        .icon-btn { 
            background: var(--bg-color); 
            border: 1px solid var(--border-color); 
            padding: 6px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            color: var(--text-color);
            box-shadow: 2px 2px 0px var(--border-color);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .icon-btn:hover { 
            background: var(--text-color); 
            color: var(--bg-color); 
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px var(--border-color);
        }

        .icon-btn:active {
            transform: translate(0, 0);
            box-shadow: 0px 0px 0px var(--border-color);
        }

        /* --- Styled Select Menu --- */
        .form-select {
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            color: var(--text-color);
            font-size: 0.7rem;
            font-weight: 800;
            padding: 8px 12px;
            text-transform: uppercase;
            cursor: pointer;
            outline: none;
            border-radius: 0;
        }

        .form-select:hover { background: var(--admin-bg); }

        /* --- Toast Notification --- */
        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .toast {
            background: var(--text-color);
            color: var(--bg-color);
            padding: 1rem 1.5rem;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border: 1px solid var(--border-color);
            box-shadow: 6px 6px 0px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast.show { transform: translateY(0); opacity: 1; }
        .toast i { width: 14px; height: 14px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="logo">JOURNAL</a>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-group">
                <span class="nav-group-title">Content</span>
                <a href="dashboard_home.html" class="sidebar-link"><i data-lucide="layout-dashboard"></i> Overview</a>
                <a href="my_posts.html" class="sidebar-link"><i data-lucide="file-text"></i> My Posts</a>
                <a href="create_post.html" class="sidebar-link"><i data-lucide="plus-square"></i> New Post</a>
                <a href="media_library.html" class="sidebar-link active"><i data-lucide="image"></i> Media</a>
            </div>
            <div class="nav-group">
                <span class="nav-group-title">Analytics</span>
                <a href="#" class="sidebar-link"><i data-lucide="bar-chart-3"></i> Traffic</a>
                <a href="#" class="sidebar-link"><i data-lucide="users"></i> Subscribers</a>
            </div>
            <div class="nav-group">
                <span class="nav-group-title">System</span>
                <a href="#" class="sidebar-link"><i data-lucide="settings"></i> Settings</a>
                <a href="login.html" class="sidebar-link"><i data-lucide="log-out"></i> Log Out</a>
            </div>
        </nav>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="main-stage">
        <button class="mobile-nav-toggle" id="menu-toggle">
            <i data-lucide="menu"></i>
        </button>

        <div class="page-header">
            <div>
                <span class="nav-group-title" style="margin:0">Assets</span>
                <h1>Media Library</h1>
            </div>
            <button class="upload-btn"><i data-lucide="upload-cloud"></i> Upload New</button>
        </div>

        <div class="media-controls">
            <span class="nav-group-title" style="margin:0" id="file-count">Showing 2 of 84 files</span>
            <div style="display: flex; gap: 1rem;">
                <select class="form-select">
                    <option>All Media</option>
                    <option>Images</option>
                    <option>Documents</option>
                </select>
            </div>
        </div>

        <div class="media-grid">
            <div class="media-card">
                <div class="media-actions">
                    <button class="icon-btn action-copy" title="Copy Link" data-url="https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85">
                        <i data-lucide="link-2" style="width:16px; height:16px;"></i>
                    </button>
                    <button class="icon-btn action-delete" title="Delete">
                        <i data-lucide="trash-2" style="width:16px; height:16px;"></i>
                    </button>
                </div>
                <img src="https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&w=400" class="media-thumb" alt="Architecture">
                <div class="media-info">
                    <span class="media-name">minimalist-lamp.jpg</span>
                    <span class="media-meta">JPG • 420 KB</span>
                </div>
            </div>

            <div class="media-card">
                <div class="media-actions">
                    <button class="icon-btn action-copy" title="Copy Link" data-url="https://images.unsplash.com/photo-1512446813987-060361ca11bc">
                        <i data-lucide="link-2" style="width:16px; height:16px;"></i>
                    </button>
                    <button class="icon-btn action-delete" title="Delete">
                        <i data-lucide="trash-2" style="width:16px; height:16px;"></i>
                    </button>
                </div>
                <img src="https://images.unsplash.com/photo-1512446813987-060361ca11bc?auto=format&fit=crop&w=400" class="media-thumb" alt="Interior">
                <div class="media-info">
                    <span class="media-name">brutalist-concrete.png</span>
                    <span class="media-meta">PNG • 1.2 MB</span>
                </div>
            </div>
        </div>

        <div id="toast-container" class="toast-container"></div>
    </main>

    <script src="js/script.js"></script>
    <script>
        lucide.createIcons();

        // --- Mobile Sidebar Logic ---
        const menuToggle = document.getElementById('menu-toggle');
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.getElementById('sidebar-overlay');

        function toggleMenu() {
            const isActive = sidebar.classList.toggle('active');
            const icon = menuToggle.querySelector('i');
            icon.setAttribute('data-lucide', isActive ? 'x' : 'menu');
            lucide.createIcons();
        }

        if (menuToggle) menuToggle.addEventListener('click', toggleMenu);
        if (overlay) overlay.addEventListener('click', toggleMenu);

        // --- Toast Logic ---
        function showToast(message, iconName = 'check') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i data-lucide="${iconName}"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        // --- Media Actions (Copy & Delete) ---
        document.querySelector('.media-grid').addEventListener('click', (e) => {
            const btn = e.target.closest('.icon-btn');
            if (!btn) return;

            // Copy Logic
            if (btn.classList.contains('action-copy')) {
                const url = btn.getAttribute('data-url');
                navigator.clipboard.writeText(url).then(() => {
                    showToast('Link Copied', 'clipboard');
                });
            }

            // Delete Logic
            if (btn.classList.contains('action-delete')) {
                if (confirm("Permanently delete this asset?")) {
                    const card = btn.closest('.media-card');
                    card.style.opacity = '0';
                    card.style.transform = 'scale(0.9)';
                    card.style.transition = '0.3s';
                    
                    setTimeout(() => {
                        card.remove();
                        showToast('File Deleted', 'trash');
                    }, 300);
                }
            }
        });
    </script>
</body>
</html>
