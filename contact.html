<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Journal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/contact.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="progress-container">
        <div class="progress-bar" id="myBar"></div>
    </div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="post_list.html" class="logo">JOURNAL</a>
            <div class="nav-links" id="navLinks">
                <a href="post_list.html">Feed</a>
                <a href="archive.html">Series</a>
                <a href="categories.html">Categories</a>
                <a href="about.html">Manifesto</a>
            </div>
            <div class="nav-controls">
                <button id="mobile-menu" class="menu-toggle" aria-label="Menu">
                    <span></span>
                    <span></span>
                </button>
                <button id="search-btn"><i data-lucide="search"></i></button>
                <button id="theme-toggle">☀️</button>
            </div>
        </div>
    </nav>

    <main class="contact-container">
        <header class="contact-header">
            <h1>Correspondence</h1>
            <p>Send a message regarding collaborations, philosophical disputes, or editorial pitches.</p>
        </header>

        <form class="contact-form" action="#" method="POST">
            <div class="form-group">
                <label for="name">Identification</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>
            </div>
            <div class="form-group">
                <label for="email">Coordinate</label>
                <input type="email" id="email" name="email" placeholder="Your email address" required>
            </div>
            <div class="form-group">
                <label for="subject">Intent</label>
                <input type="text" id="subject" name="subject" placeholder="General Inquiry / Pitch / Feedback">
            </div>
            <div class="form-group">
                <label for="message">Transmission</label>
                <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
            </div>
            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </main>

    <div id="search-overlay" class="search-overlay">
        <button id="close-search" class="close-search">&times;</button>
        <div class="search-content">
            <input type="text" id="search-input" placeholder="Search...">
            <div id="search-suggestions" class="search-suggestions"></div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
