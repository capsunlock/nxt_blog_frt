<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Journal</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .contact-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 8rem 2rem;
        }
        .contact-header {
            margin-bottom: 4rem;
        }
        .contact-header h1 {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            margin-bottom: 1rem;
        }
        .contact-header p {
            font-size: 1.2rem;
            color: var(--secondary-text);
            max-width: 45ch;
        }

        /* --- Brutalist Form --- */
        .contact-form {
            display: grid;
            gap: 2.5rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .form-group label {
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            opacity: 0.6;
        }
        .form-group input, 
        .form-group textarea {
            background: none;
            border: none;
            border-bottom: 2px solid var(--border-color);
            padding: 1rem 0;
            color: var(--text-color);
            font-family: inherit;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }
        .form-group input:focus, 
        .form-group textarea:focus {
            border-color: var(--text-color);
        }
        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .submit-btn {
            background: var(--text-color);
            color: var(--bg-color);
            border: none;
            padding: 1.5rem 3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            width: fit-content;
            transition: opacity 0.3s ease;
            margin-top: 1rem;
        }
        .submit-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .contact-header h1 { font-size: 3rem; }
        }
    </style>
</head>
<body>
    <div class="progress-container"><div class="progress-bar" id="myBar"></div></div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">JOURNAL</a>
            <div class="nav-links" id="navLinks">
                <a href="post_list.html">Articles</a>
                <a href="archive.html">Series</a>
                <a href="about.html">Manifesto</a>
            </div>
            <div class="nav-controls">
                <button id="search-btn"><i data-lucide="search"></i></button>
                <button id="theme-toggle">☀️</button>
            </div>
        </div>
    </nav>

    <main class="contact-container">
        <header class="contact-header">
            <h1>Correspondence</h1>
            <p>Send a message regarding collaborations, philosophical disputes, or editorial pitches.</p>
        </header>

        <form class="contact-form" action="#" method="POST">
            <div class="form-group">
                <label for="name">Identification</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>
            </div>
            <div class="form-group">
                <label for="email">Coordinate</label>
                <input type="email" id="email" name="email" placeholder="Your email address" required>
            </div>
            <div class="form-group">
                <label for="subject">Intent</label>
                <input type="text" id="subject" name="subject" placeholder="General Inquiry / Pitch / Feedback">
            </div>
            <div class="form-group">
                <label for="message">Transmission</label>
                <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
            </div>
            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </main>

    <div id="search-overlay" class="search-overlay">
        <button id="close-search" class="close-search">&times;</button>
        <div class="search-content">
            <input type="text" id="search-input" placeholder="Search...">
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
