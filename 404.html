<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Logic Break</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .error-container {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }
        .error-code {
            font-size: clamp(8rem, 25vw, 18rem);
            font-weight: 900;
            line-height: 0.8;
            letter-spacing: -0.05em;
            margin: 0;
            color: var(--text-color);
            opacity: 0.08;
            position: absolute;
            z-index: -1;
        }
        .error-message {
            position: relative;
            z-index: 1;
        }
        .error-message h2 {
            font-size: 3rem;
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }
        .error-message p {
            color: var(--secondary-text);
            max-width: 40ch;
            margin: 0 auto 2.5rem;
            font-size: 1.1rem;
        }
        .back-link {
            font-weight: 700;
            text-decoration: none;
            color: var(--text-color);
            border: 2px solid var(--text-color);
            padding: 1rem 2rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.8rem;
            transition: background 0.3s, color 0.3s;
        }
        .back-link:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }
    </style>
</head>
<body>
    <div class="progress-container"><div class="progress-bar" id="myBar"></div></div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">JOURNAL</a>
            <div class="nav-links" id="navLinks">
                <a href="post_list.html">Articles</a>
                <a href="archive.html">Series</a>
                <a href="about.html">Manifesto</a>
            </div>
            <div class="nav-controls">
                <button id="search-btn"><i data-lucide="search"></i></button>
                <button id="theme-toggle">☀️</button>
            </div>
        </div>
    </nav>

    <main class="error-container">
        <h1 class="error-code">404</h1>
        <div class="error-message">
            <h2>Logic Break</h2>
            <p>The requested coordinate does not exist in our current index. It may have been archived or deleted.</p>
            <a href="post_list.html" class="back-link">Return to Index →</a>
        </div>
    </main>

    <div id="search-overlay" class="search-overlay">
        <button id="close-search" class="close-search">&times;</button>
        <div class="search-content">
            <input type="text" id="search-input" placeholder="Search...">
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
