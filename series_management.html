<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Series Management — Journal Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/archive.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="admin-dashboard">

    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="post_list.html" class="logo">JOURNAL</a>
            <button class="theme-toggle-btn sidebar-theme-toggle" id="theme-toggle" aria-label="Toggle theme">
                <span class="sun-icon">☀️</span>
                <span class="moon-icon">🌙</span>
            </button>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-group">
                <span class="nav-group-title">Content</span>
                    <a href="dashboard_home.html" class="sidebar-link"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                    <a href="dashboard.html" class="sidebar-link"><i data-lucide="layout-dashboard"></i> Overview</a>
                <a href="my_posts.html" class="sidebar-link"><i data-lucide="file-text"></i> My Posts</a>
                <a href="create_post.html" class="sidebar-link"><i data-lucide="plus-square"></i> New Post</a>
                <a href="media_library.html" class="sidebar-link"><i data-lucide="image"></i> Media</a>
                <a href="series_management.html" class="sidebar-link active"><i data-lucide="layers"></i> Series</a>
            </div>
            <div class="nav-group">
                <span class="nav-group-title">Analytics</span>
                <a href="#" class="sidebar-link"><i data-lucide="bar-chart-3"></i> Traffic</a>
                <a href="#" class="sidebar-link"><i data-lucide="users"></i> Subscribers</a>
            </div>
            <div class="nav-group">
                <span class="nav-group-title">System</span>
                <a href="post_list.html" class="sidebar-link"><i data-lucide="external-link"></i> View Site</a>
                <a href="settings.html" class="sidebar-link"><i data-lucide="settings"></i> Settings</a>
                <a href="login.html" class="sidebar-link"><i data-lucide="log-out"></i> Log Out</a>
            </div>
        </nav>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="main-stage">
        <button class="mobile-nav-toggle" id="menu-toggle">
            <i data-lucide="menu"></i>
        </button>

        <header class="admin-header">
            <h1>Series Index</h1>
            <div class="header-actions">
                <button id="search-btn" class="btn btn-icon" aria-label="Search"><i data-lucide="search"></i></button>
                <button class="btn btn-primary" id="open-series-modal"><i data-lucide="plus"></i> New Series</button>
            </div>
        </header>

        <section class="archive-container">
            <div class="archive-header">
                <h1 class="archive-title">Series</h1>
                <p class="archive-description">Manage your curated collections and deep dives.</p>
            </div>

            <section class="series-grid" id="series-container">
                <div class="empty-state">No series defined in system.</div>
            </section>
        </section>
    </main>

    <div id="series-modal" class="admin-modal">
        <div class="modal-content">
            <h2 class="section-title">Initialize New Series</h2>
            <div class="form-group">
                <label>Series Name</label>
                <input type="text" id="series-name" placeholder="e.g. CSS Architecture">
            </div>
            <div class="form-group">
                <label>Description (Short)</label>
                <input type="text" id="series-desc" placeholder="A deep dive into grid and flexbox.">
            </div>
            <div class="modal-actions">
                <button class="btn" id="close-modal">Cancel</button>
                <button class="btn btn-primary" id="save-series">Create Entry</button>
            </div>
        </div>
    </div>

    <div id="search-overlay" class="search-overlay">
        <button id="close-search" class="close-search">&times;</button>
        <div class="search-content">
            <input type="text" id="search-input" placeholder="Search...">
            <div id="search-suggestions" class="search-suggestions"></div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/series.js"></script>
</body>
</html>
